name: Güzelyalı haritası

# GitHub runner'ının OpenStreetMap'e erişimi olduğu için harita burada üretilir,
# üretilen PNG'ler hem depoya işlenir hem de GitHub Pages'te yayımlanır.
on:
  push:
    branches: ["**"]
    paths:
      - "*.py"
      - "requirements.txt"
      - "tools/**"
      - ".github/workflows/build-map.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guzelyali-pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları kur
        # prettymaps'in meta verisi (numpy<1.25) bağımlılık çözümlemesini
        # kilitlediği için önce bağımlılıklar, sonra --no-deps ile prettymaps.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "osmnx>=1.9.3,<2.0" \
            "pandas>=2.3,<3" \
            "numpy>=2.0" \
            "geopandas>=1.0" \
            "shapely>=2.0" \
            "matplotlib>=3.9" \
            "scipy>=1.11" \
            "networkx>=3.0" \
            "requests>=2.31" \
            "tqdm>=4.60" \
            "opencv-python-headless>=4.11" \
            "scikit-image>=0.25" \
            "rioxarray>=0.18" \
            "vsketch>=1.0" \
            "thefuzz>=0.22" \
            "elevation>=1.1" \
            "ipython>=8.0"
          pip install --no-deps "prettymaps==1.4.2"
          python -c "import prettymaps, osmnx; print('prettymaps hazır, osmnx', osmnx.__version__)"

      - name: Haritaları çiz
        run: |
          mkdir -p site
          python guzelyali_izmir.py --palette ege  --radius 1100 --dpi 220 --out site/guzelyali-ege.png
          python guzelyali_izmir.py --palette gece --radius 1100 --dpi 220 --out site/guzelyali-gece.png
          ls -lh site/

      - name: Sayfayı oluştur
        run: python tools/build_site.py site

      - name: PNG'leri depoya işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Güzelyalı haritalarını güncelle (otomatik) [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: PNG'leri iş çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: guzelyali-haritalari
          path: site/*.png

      - name: Pages yapılandır
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Pages artefaktını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
        continue-on-error: true

      - name: Pages'e dağıt
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
